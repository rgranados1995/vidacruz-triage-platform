# CI of clinical-assistant-service: build with every test (Testcontainers runs Kafka and Redis; the Anthropic API is
# faked with WireMock, so no key is needed), coverage rules of every module and the image of the deployment.
name: clinical-assistant-service

on:
  push:
    branches: [main]
    paths:
      - clinical-assistant-service/**
      - .github/workflows/clinical-assistant-service.yml
  pull_request:
    paths:
      - clinical-assistant-service/**
      - .github/workflows/clinical-assistant-service.yml

permissions:
  contents: read

concurrency:
  group: clinical-assistant-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clinical-assistant-service
    steps:
      - uses: actions/checkout@v7

      # The Gradle cache also keeps the embedding model of the tests (~/.gradle/caches/vidacruz), pinned by commit
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            clinical-assistant-service/**/*.gradle
            clinical-assistant-service/gradle/wrapper/gradle-wrapper.properties

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: clinical-assistant-service-test-reports
          path: clinical-assistant-service/**/build/reports/tests/
          retention-days: 7

      - name: Build the image
        run: docker build --file deployment/Dockerfile --tag clinical-assistant-service:${{ github.sha }} .
