# Deployment to Azure, started by hand (Actions > deploy > Run workflow). Signs in to Azure with OIDC: the
# identity created by infra/azure/main.bicep trusts only the jobs of this repository in the environment "azure",
# so no Azure password is stored in GitHub. The variables and secrets are those listed by infra/azure/provision.ps1.
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: azure
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build, push and deploy
        shell: pwsh
        env:
          TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}
          ASSISTANT_API_KEY: ${{ secrets.ASSISTANT_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./infra/azure/deploy.ps1 -ResourceGroup '${{ vars.AZURE_RESOURCE_GROUP }}' -ImageTag '${{ github.sha }}'
