server:
  port: 8082

spring:
  data:
    redis:
      host: localhost
      port: 6379
      # Local default of docker-compose.yml (REDIS_PASSWORD in .env overrides it there)
      password: redis-local

adapters:
  claude:
    # Local runs read the key of the developer from the environment; without it the assistant runs degraded
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5-5
    effort: medium
    timeout: 15s
  kafka:
    triage-events:
      bootstrap-servers: localhost:29092
      topic: triaje.eventos
      group-id: clinical-assistant-urgency-state
  protocol-corpus:
    top-k: 3
    similarity-threshold: 0.50
    # Downloaded by ./gradlew downloadEmbeddingModel
    embedding-model: file:${user.home}/.gradle/caches/vidacruz/paraphrase-multilingual-MiniLM-L12-v2-e8f8c21/model.onnx
    embedding-tokenizer: file:${user.home}/.gradle/caches/vidacruz/paraphrase-multilingual-MiniLM-L12-v2-e8f8c21/tokenizer.json

resilience4j:
  retry:
    instances:
      claude:
        max-attempts: 2
        wait-duration: 500ms
  timelimiter:
    instances:
      claude:
        timeout-duration: 15s

security:
  api-key: local-dev-assistant-key-0001

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO

management:
  tracing:
    sampling:
      probability: 1.0
