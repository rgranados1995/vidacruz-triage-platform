server:
  port: ${SERVER_PORT}
  shutdown: graceful

spring:
  application:
    name: clinical-assistant-service
  devtools:
    add-properties: false
  reactor:
    context-propagation: auto
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2s

adapters:
  kafka:
    # Events of the triage that build the state of the emergency room (RF-04 part B)
    triage-events:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
      topic: ${TRIAGE_EVENTS_TOPIC}
      group-id: ${URGENCY_CONSUMER_GROUP}
  urgency-state:
    # At least the retention of the topic: a late older event can never bring a discharged patient back
    discharged-retention: 7d
  claude:
    # Blank: the service starts and the questions that need the model are answered with 503 (degraded mode)
    api-key: ${ANTHROPIC_API_KEY}
    base-url: https://api.anthropic.com
    model: ${LLM_MODEL}
    effort: ${LLM_EFFORT}
    max-tokens: 2048
    timeout: ${LLM_TIMEOUT}
  protocol-corpus:
    top-k: ${RAG_TOP_K}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD}
    embedding-model: ${EMBEDDING_MODEL_URI}
    embedding-tokenizer: ${EMBEDDING_TOKENIZER_URI}

# Resilience of the calls to the AI provider (ADR 0003). Retry outermost, then the circuit breaker, then the time
# limit of each attempt; whatever they give up on is answered as 503 (degraded mode).
resilience4j:
  retry:
    instances:
      claude:
        # Attempts in total, the first one included; only transient failures are retried
        max-attempts: ${LLM_RETRY_MAX_ATTEMPTS}
        wait-duration: ${LLM_RETRY_BACKOFF}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exception-predicate: com.vidacruz.assistant.claude.ProviderFailures$Transient
  circuitbreaker:
    instances:
      claude:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exception-predicate: com.vidacruz.assistant.claude.ProviderFailures$Outage
        # An open circuit is the degraded mode, not an unhealthy pod: it stays out of the probes
        register-health-indicator: false
  timelimiter:
    instances:
      claude:
        timeout-duration: ${LLM_TIMEOUT}
        cancel-running-future: true

errors:
  # Retry-After of a 503: the time the circuit breaker stays open
  unavailable-retry-after: 30s

routes:
  consultation: /asistente/consulta
  urgency-state: /asistente/estado-urgencias

security:
  api-key: ${ASSISTANT_API_KEY}

springdoc:
  # Builds the OpenAPI document at startup: building it on the first request scans the classpath on a Netty thread
  pre-loading-enabled: true
  api-docs:
    enabled: ${API_DOCS_ENABLED}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED}

logging:
  structured:
    format:
      console: ecs
  level:
    root: ${LOG_LEVEL}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  # The spans are exported over OTLP only when the environment sets MANAGEMENT_OTLP_TRACING_ENDPOINT (for example
  # http://jaeger:4318/v1/traces); without it the trace ids still reach the logs and the Kafka headers.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY}
