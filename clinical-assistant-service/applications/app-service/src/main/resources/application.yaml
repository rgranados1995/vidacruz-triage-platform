server:
  port: ${SERVER_PORT}
  shutdown: graceful

spring:
  application:
    name: clinical-assistant-service
  devtools:
    add-properties: false
  reactor:
    context-propagation: auto

logging:
  structured:
    format:
      console: ecs
  level:
    root: ${LOG_LEVEL}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY}
