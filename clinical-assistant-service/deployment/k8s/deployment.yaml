# Two replicas share the consumer group (3 partitions) and the projection in Redis; each one keeps its own copy of
# the protocol corpus in memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-assistant-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clinical-assistant-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinical-assistant-service
    spec:
      automountServiceAccountToken: false
      # Longer than the graceful shutdown of Spring (30 s) plus the pause of preStop
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clinical-assistant-service
          image: vidacruz/clinical-assistant-service
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: clinical-assistant-service-config
            - secretRef:
                name: clinical-assistant-service-secrets
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1536Mi
          # Loading the embedding model and indexing the corpus takes up to a minute on a small node
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # The degraded mode (no LLM, no Redis) keeps the pod ready: it answers 503 with a clear message
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Lets the ingress stop sending requests before the shutdown starts
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The native libraries of ONNX Runtime and the tokenizer are extracted here (DJL_CACHE_DIR=/tmp/djl)
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
