# Shape of the secret of clinical-assistant-service. It is NOT part of the kustomization and never holds real
# values: infra/azure/deploy.ps1 creates it from the environment (ASSISTANT_API_KEY and ANTHROPIC_API_KEY).
apiVersion: v1
kind: Secret
metadata:
  name: clinical-assistant-service-secrets
type: Opaque
stringData:
  # X-API-Key of the assistant API, at least 16 characters
  ASSISTANT_API_KEY: <api-key>
  # Key of the Anthropic API; empty runs the assistant in degraded mode (503 for the questions that need the model)
  ANTHROPIC_API_KEY: <anthropic-api-key>
