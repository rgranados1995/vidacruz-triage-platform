package=com.vidacruz.assistant
systemProp.version=3.28.0
reactive=true
lombok=true
metrics=true
language=java
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.integrity-check=true
systemProp.sonar.gradle.skipCompile=true
# Windows with Java 18+: Gradle writes the command line of the test JVMs in its default charset, and Java
# reads it in the charset of the system, so a project folder with accents breaks the classpath of the tests.
# COMPAT makes both the same. Compilation and tests stay UTF-8 (main.gradle). The memory is the Gradle default.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -Dfile.encoding=COMPAT
