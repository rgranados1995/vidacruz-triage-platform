apply plugin: 'info.solidsoft.pitest.aggregator'

// Minimum instruction coverage per module; MainApplication is excluded because it only starts Spring
def coverageMinimum = 0.90

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    // Where the Spring Boot plugin manages the versions (app-service), its rule would bring Testcontainers back
    // to 1.21.3: the property overrides the version of the Boot BOM too
    ext['testcontainers.version'] = testcontainersVersion

    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'info.solidsoft.pitest'

    compileJava.dependsOn validateStructure

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    test {
        useJUnitPlatform()
    }

    // Sources, tests and messages are UTF-8 (Spanish accents) whatever the default charset of the machine is
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        defaultCharacterEncoding = 'UTF-8'
    }

    dependencies {
        implementation 'io.projectreactor:reactor-core'
        implementation 'io.projectreactor.addons:reactor-extra'

        testImplementation 'io.projectreactor.tools:blockhound-junit-platform:1.0.15.RELEASE'

        testImplementation 'io.projectreactor:reactor-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor  "org.projectlombok:lombok:${lombokVersion}"
        testCompileOnly  "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor  "org.projectlombok:lombok:${lombokVersion}"
        implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        // Testcontainers 1.21.3 (managed by Spring Boot 3.5.7) speaks Docker API 1.32, which recent Docker
        // engines reject (minimum 1.40, as on the GitHub runners); 1.21.4 negotiates a supported version
        testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
    }

    tasks.withType(Test).configureEach {
        if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_13)) {
            jvmArgs += [
                    "-XX:+AllowRedefinitionToAddDeleteMethods"
            ]
        }
    }

    test.finalizedBy(project.tasks.jacocoTestReport)

    pitest {
        targetClasses = ['com.vidacruz.assistant.*']
        // Declarative wiring (routes, OpenAPI, security chain): verified by the acceptance tests. Its mutants are
        // not measurable with Spring tests because the cached context keeps the unmutated beans.
        excludedClasses = ['*.ConsultationRouter', '*.ConsultationApiDocs', '*.UrgencyStateRouter',
                           '*.UrgencyStateApiDocs', '*.ApiKeySecurityConfig', '*.OpenApiConfig']
        // Integration tests start the whole application: running them once per mutant would take too long
        excludedTestClasses = ['*IntegrationTest']
        pitestVersion = '1.20.6'
        verbose = false
        outputFormats = ['XML', 'HTML']
        threads = 8
        exportLineCoverage = true
        useClasspathFile = true
        timestampedReports = false
        fileExtensionsToFilter.addAll('xml', 'orbit')
        junit5PluginVersion = '1.2.3'
        failWhenNoMutations = false
        jvmArgs = ["-XX:+AllowRedefinitionToAddDeleteMethods", "-Dfile.encoding=UTF-8"]
    }

    // Mutation tests run on demand (./gradlew pitest pitestReportAggregate), not on every build
    jacocoTestReport {
        dependsOn test
        reports {
            xml.setRequired true
            xml.setOutputLocation layout.buildDirectory.file("reports/jacoco.xml")
            csv.setRequired false
            html.setOutputLocation layout.buildDirectory.dir("reports/jacocoHtml")
        }
    }

    jacocoTestCoverageVerification {
        dependsOn test
        classDirectories.setFrom(files(sourceSets.main.output.classesDirs.files.collect {
            fileTree(dir: it, exclude: ['**/MainApplication.class'])
        }))
        violationRules {
            rule {
                limit {
                    minimum = coverageMinimum
                }
            }
        }
    }

    check.dependsOn jacocoTestCoverageVerification

}

jacoco {
    toolVersion = "${jacocoVersion}"
    reportsDirectory.set(layout.buildDirectory.dir("reports"))
}

tasks.register('jacocoMergedReport', JacocoReport) {
    dependsOn = [subprojects.test, subprojects.jacocoTestReport]
    additionalSourceDirs.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    sourceDirectories.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom files(subprojects.sourceSets.main.output)
    executionData.setFrom project.fileTree(dir: '.', include: '**/build/jacoco/test.exec')
    reports {
        xml.setRequired true
        csv.setRequired false
        html.setRequired true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs = [
            '-Amapstruct.suppressGeneratorTimestamp=true'
    ]
}

pitestReportAggregate {
    doLast {
        def reportDir = layout.buildDirectory.dir("reports/pitest").get().asFile
        def consolidatedReport = new File(reportDir, 'mutations.xml')
        consolidatedReport.withWriter { writer ->
            writer.write("<mutations>\n")
            subprojects.each { subproject ->
                def xmlReport = subproject.layout.buildDirectory.file("reports/pitest/mutations.xml").get().asFile
                if (xmlReport.exists()) {
                    def xmlContent = xmlReport.text
                    xmlContent = xmlContent.replaceAll("<\\?xml[^>]*>", "")
                    xmlContent = xmlContent.replaceAll("</?mutations( partial=\"true\")?>", "")
                    writer.write(xmlContent.trim() + "\n")
                }
            }
            writer.write("</mutations>")
        }
    }
}

// Multilingual sentence embeddings of the protocol search: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
// (Apache-2.0), int8 for AVX2. Pinned by commit and checked by SHA-256; downloaded once to the Gradle user home for
// the tests (the Docker image downloads the same files with the same checks).
def embeddingModelRevision = 'e8f8c211226b894fcb81acc59f3b34ba3efd5f42'
ext.embeddingModelDir = new File(gradle.gradleUserHomeDir,
        "caches/vidacruz/paraphrase-multilingual-MiniLM-L12-v2-${embeddingModelRevision.take(7)}")

tasks.register('downloadEmbeddingModel') {
    def dir = embeddingModelDir
    def baseUrl = "https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2/resolve/${embeddingModelRevision}"
    def files = [
            'model.onnx'    : ['onnx/model_quint8_avx2.onnx', '98a01d88b7de996cdea58c32ca71208c09968d143798814b2ea09d3439dc334f'],
            'tokenizer.json': ['tokenizer.json', '2c3387be76557bd40970cec13153b3bbf80407865484b209e655e5e4729076b8']
    ]
    outputs.dir(dir)
    doLast {
        def sha256 = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { stream -> stream.eachByte(1 << 16) { bytes, length -> digest.update(bytes, 0, length) } }
            digest.digest().encodeHex().toString()
        }
        dir.mkdirs()
        files.each { name, spec ->
            def target = new File(dir, name)
            if (!target.exists() || sha256(target) != spec[1]) {
                new URL("${baseUrl}/${spec[0]}").withInputStream { input -> target.withOutputStream { it << input } }
                if (sha256(target) != spec[1]) {
                    target.delete()
                    throw new GradleException("Checksum mismatch for ${name} of the embedding model")
                }
            }
        }
    }
}

tasks.named('wrapper') {
    gradleVersion = '8.14.3'
}
