pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

buildCache {
    local {
        directory = new File(rootDir, 'build-cache')
    }
}

rootProject.name = 'clinical-assistant-service'

include ':app-service'
include ':model'
include ':usecase'
project(':app-service').projectDir = file('./applications/app-service')
project(':model').projectDir = file('./domain/model')
project(':usecase').projectDir = file('./domain/usecase')
include ':reactive-web'
project(':reactive-web').projectDir = file('./infrastructure/entry-points/reactive-web')
include ':protocol-corpus'
project(':protocol-corpus').projectDir = file('./infrastructure/driven-adapters/protocol-corpus')
include ':claude-llm'
project(':claude-llm').projectDir = file('./infrastructure/driven-adapters/claude-llm')
include ':kafka-consumer'
project(':kafka-consumer').projectDir = file('./infrastructure/entry-points/kafka-consumer')
include ':redis'
project(':redis').projectDir = file('./infrastructure/driven-adapters/redis')