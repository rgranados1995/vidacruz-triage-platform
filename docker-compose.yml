# Local environment: infrastructure and both microservices with one command (docker compose up --build).
# Values with a default here are local-only; deployed environments take them from Kubernetes Secrets/ConfigMaps.
name: vidacruz

services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: ${POSTGRES_USER:-triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triage-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d triage"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT for the containers, PLAINTEXT_HOST for services started from the IDE
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by their owner service, never by a typo in a producer
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7.4.12-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  triage-service:
    build:
      context: ./triage-service
      dockerfile: deployment/Dockerfile
    image: vidacruz/triage-service:local
    environment:
      SERVER_PORT: 8081
      LOG_LEVEL: INFO
      TRACING_SAMPLING_PROBABILITY: "1.0"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: triage
      DB_USERNAME: ${POSTGRES_USER:-triage}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-triage-local}
      DB_POOL_INITIAL_SIZE: 2
      DB_POOL_MAX_SIZE: 10
      # SLA of RN-02 in minutes; lower them to watch the escalation without waiting
      SLA_MINUTES_CRITICAL: 5
      SLA_MINUTES_URGENT: 10
      SLA_MINUTES_URGENT_2: 30
      SLA_MINUTES_NON_URGENT: 60
      SLA_MINUTES_NON_URGENT_2: 120
      ADMINISTRATIVE_COMPLAINTS: "documentos,recolección de resultados,renovación de recetario,vacunación,seguimiento"
      # Local-only key; deployed environments read it from a secret
      API_KEY: ${TRIAGE_API_KEY:-local-dev-api-key-0001}
      API_DOCS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRIAGE_EVENTS_TOPIC: triaje.eventos
      TRIAGE_EVENTS_PARTITIONS: 3
      TRIAGE_EVENTS_REPLICAS: 1
      OUTBOX_POLL_INTERVAL: 500ms
      OUTBOX_BATCH_SIZE: 100
      OUTBOX_LEASE: 30s
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  clinical-assistant-service:
    build:
      context: ./clinical-assistant-service
      dockerfile: deployment/Dockerfile
    image: vidacruz/clinical-assistant-service:local
    environment:
      SERVER_PORT: 8082
      LOG_LEVEL: INFO
      TRACING_SAMPLING_PROBABILITY: "1.0"
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
