# Everything of the namespace vidacruz: the platform (Kafka, Redis), the public routes and both microservices.
# infra/azure/deploy.ps1 renders it (kubectl kustomize), replaces the __TOKENS__ with the outputs of main.bicep and
# applies it. The cluster-wide resources are in cluster/, the gateway in edge/ and the secrets are created by the
# script.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vidacruz
resources:
  - namespace.yaml
  - kafka.yaml
  - redis.yaml
  - routes.yaml
  - ../../triage-service/deployment/k8s
  - ../../clinical-assistant-service/deployment/k8s
images:
  - name: vidacruz/triage-service
    newName: __REGISTRY__/triage-service
    newTag: __IMAGE_TAG__
  - name: vidacruz/clinical-assistant-service
    newName: __REGISTRY__/clinical-assistant-service
    newTag: __IMAGE_TAG__
