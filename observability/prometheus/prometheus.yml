# Local Prometheus: scrapes both services every 5 seconds (enough to watch a demo live).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: triage-service
    metrics_path: /prometheus
    static_configs:
      - targets: ["triage-service:8081"]

  - job_name: clinical-assistant-service
    metrics_path: /prometheus
    static_configs:
      - targets: ["clinical-assistant-service:8082"]
