server:
  port: ${SERVER_PORT}
  shutdown: graceful

spring:
  application:
    name: triage-service
  devtools:
    add-properties: false
  reactor:
    context-propagation: auto
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      initial-size: ${DB_POOL_INITIAL_SIZE}
      max-size: ${DB_POOL_MAX_SIZE}
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # A send gives up before the outbox lease (OUTBOX_LEASE) expires, so no other replica claims it meanwhile
        request.timeout.ms: 10000
        delivery.timeout.ms: 20000
    admin:
      # Kafka down at startup must not keep the triage from starting: events wait in the outbox
      fail-fast: false
      operation-timeout: 10s

adapters:
  kafka:
    triage-events:
      name: ${TRIAGE_EVENTS_TOPIC}
      partitions: ${TRIAGE_EVENTS_PARTITIONS}
      replicas: ${TRIAGE_EVENTS_REPLICAS}

sla-monitor:
  interval: ${SLA_MONITOR_INTERVAL}
  batch-size: ${SLA_MONITOR_BATCH_SIZE}

outbox:
  poll-interval: ${OUTBOX_POLL_INTERVAL}
  batch-size: ${OUTBOX_BATCH_SIZE}
  lease: ${OUTBOX_LEASE}

triage:
  sla-minutes:
    CRITICAL: ${SLA_MINUTES_CRITICAL}
    URGENT: ${SLA_MINUTES_URGENT}
    URGENT_2: ${SLA_MINUTES_URGENT_2}
    NON_URGENT: ${SLA_MINUTES_NON_URGENT}
    NON_URGENT_2: ${SLA_MINUTES_NON_URGENT_2}
  administrative-complaints: ${ADMINISTRATIVE_COMPLAINTS}

report:
  # Longest range of the operation report: bounds the cost of the query and the rows of the answer (one per hour)
  max-range: ${REPORT_MAX_RANGE}

alerts:
  stream:
    # Comment sent on an idle alert stream so proxies and load balancers do not close it
    heartbeat: ${ALERTS_HEARTBEAT_INTERVAL}

routes:
  patients: /triage/pacientes
  operation-report: /triage/reportes/operacion
  alerts: /triage/alertas

security:
  api-key: ${API_KEY}

springdoc:
  # Builds the OpenAPI document at startup: building it on the first request scans the classpath on a Netty thread
  pre-loading-enabled: true
  api-docs:
    enabled: ${API_DOCS_ENABLED}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED}

logging:
  structured:
    format:
      console: ecs
  level:
    root: ${LOG_LEVEL}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # The database takes the pod out of the load balancer; it never restarts it (liveness has no dependencies)
        readiness:
          include: readinessState, r2dbc
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY}
