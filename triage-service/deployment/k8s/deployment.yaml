# Two replicas: the outbox claim (SKIP LOCKED) and the escalation (applied once, RN-03) are safe with several.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: triage-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triage-service
    spec:
      automountServiceAccountToken: false
      # Longer than the graceful shutdown of Spring (30 s) plus the pause of preStop
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: triage-service
          image: vidacruz/triage-service
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: triage-service-config
            - secretRef:
                name: triage-service-secrets
          # CPU requested is what it needs at rest, so the platform fits one node of 4 vCPU next to the pods of AKS;
          # with no CPU limit it uses the free CPU of the node when it starts or when traffic comes
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Out of the load balancer while the database is unreachable; never restarted for it
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Lets the ingress stop sending requests before the shutdown starts
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
