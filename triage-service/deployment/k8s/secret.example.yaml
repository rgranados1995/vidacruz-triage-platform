# Shape of the secret of triage-service. It is NOT part of the kustomization and never holds real values:
# infra/azure/deploy.ps1 creates it from the environment (TRIAGE_API_KEY and POSTGRES_PASSWORD).
apiVersion: v1
kind: Secret
metadata:
  name: triage-service-secrets
type: Opaque
stringData:
  # X-API-Key of the triage API, at least 16 characters
  API_KEY: <api-key>
  # Password of the administrator of the PostgreSQL server (parameter postgresAdminPassword of main.bicep)
  DB_PASSWORD: <postgres-password>
